<html>
    <head>
        <style>
            .Susbscribe-button
            {
                background-color: aqua;
                color: antiquewhite;
                border:none;
                height:36px;
                width:75px;
                border-radius:2px ;
                cursor: pointer;
                margin-left: 4px;
            }
            .join-button
            {
                background-color: blueviolet;
                border-color: aliceblue;
                border-style: dotted;
                border-width: 2px;
                color: brown;
                height: 36px;
                width: 50px;
                border-radius: 3px;
                cursor: zoom-in;
            }
            .tweet-button
            {
                background-color: burlywood;
                color: rgb(255 255 255);
                border: none;
                height: 36px;
                width: 74px;
                border-radius:18px;
                font-width: 20px;
                font-size:20px;
                cursor: pointer;
                margin-left:15px;

            }


        </style>

    </head>

    <body>
        <button class="Susbscribe-button"> Susbscribe</button>
        <button class="join-button">Join</button>
        <button class="tweet-button">Tweet</button>
    </body>

</html>
