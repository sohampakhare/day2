<html>
    <head>
        <style>
            .addbutton
            {
                background-color:rgb(255 216 20);
                color: black;
                height: 25px;
                width: 150px;
                border: none;
                border-radius: 25px;
                  opacity: 0.15s;
                  transition:background-color 1s,color 1s;
                
            }
            .addbutton:hover{

                background-color: black;
                color:rgb(255 216 20) ;
              
            }
            .addbutton:active{
                opacity: 0.5;
            }
        </style>
    </head>

<body>

    <button class="addbutton">Add to Cart</button>
</body>
</html>
