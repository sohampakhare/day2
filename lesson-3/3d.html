<html>
    <head>
        <style>
            .start-button
            {
                background-color: rgb(121 82 179);
                color: white;
                height: 25px;
                width:85px;
                border-radius: 3px;
                border: none;
                cursor: pointer;
                font-size: bold;
                transition: background-color 0.15s;
             }
             .start-button:hover{
                background-color:red;
             }
            .down
            {
                background-color: rgb(108 117 125);
                color: black;
                height: 25px;
                width: 75px;
                border-radius: 3px;
                border: none;
                cursor: pointer;
                transition: background-color 0.25s;

            }
            .down:hover{
                background-color: rgb(108,117,0);
                color: white;

            }
        </style>
    </head>
    <body>
        <button class="start-button">Get Started</button>
        <button class="down">Download</button>
    </body>
</html>
