<html>
    <head>
        <style>
            .start-button
            {
                background-color: rgb(121 82 179);
                color: white;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 16px;
                padding-right: 16px;
                border-radius: 3px;
                border: none;
                cursor: pointer;
                font-size: bold;
                transition: background-color 0.15s;
             }
             .start-button:hover{
                background-color:red;
             }
            .down
            {
                background-color: rgb(108 117 125);
                color: black;
                padding-left: 16px;
                padding-right: 16px;
                padding-bottom: 10px;
                padding-top: 10px;
              
                border-radius: 3px;
                border: none;
                cursor: pointer;
                transition: background-color 0.25s;

            }
            .down:hover{
                background-color: rgb(108,117,0);
                color: white;

            }
        </style>
    </head>
    <body>
        <button class="start-button">Get Started</button>
        <button class="down">Download</button>
    </body>
</html>
